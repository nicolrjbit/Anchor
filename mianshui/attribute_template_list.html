<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>属性模版管理 · 中免日上运营平台</title>
<style>
  :root{
    --primary:#7A2432;
    --primary-hover:#631D29;
    --sidebar:#1A1A2E;
    --sidebar-sub:#252538;
    --text:#333;
    --muted:#888;
    --line:#E8E8E8;
    --bg:#F0F2F5;
    --card:#FFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
  .layout{display:flex;min-height:100vh}
  .g-side{width:56px;background:var(--sidebar);flex:none;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
  .g-side .logo{width:32px;height:32px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-bottom:8px}
  .g-nav{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:#999;font-size:18px;cursor:pointer}
  .g-nav.on{background:var(--primary);color:#fff}
  .sub-side{width:160px;background:var(--sidebar-sub);flex:none;padding:12px 0;color:#aaa;font-size:12px}
  .sub-side .title{padding:8px 16px 12px;color:#666;font-size:11px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px}
  .sub-nav{display:block;padding:8px 16px;color:#bbb;text-decoration:none;border-left:3px solid transparent}
  .sub-nav:hover{color:#fff;background:rgba(255,255,255,.04)}
  .sub-nav.on{color:var(--primary);background:rgba(122,36,50,.15);border-left-color:var(--primary);font-weight:600}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:48px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;flex:none}
  .topbar h1{font-size:15px;font-weight:600}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .topbar .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px}
  .tabs{height:40px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 16px;flex:none}
  .tab{padding:8px 16px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .content{flex:1;padding:16px;overflow:auto}
  .filter{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .field label{display:block;font-size:12px;color:#333;margin-bottom:6px}
  .field input,.field select{border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px;width:220px;font-family:inherit;background:#fff}
  .filter-btns{margin-left:auto;display:flex;gap:8px}
  .btn{border:none;border-radius:4px;padding:6px 20px;font-size:12px;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-default{background:#fff;border:1px solid var(--line);color:#333}
  .list-card{background:var(--card);border:1px solid var(--line);border-radius:4px}
  .list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .list-head h2{font-size:14px;font-weight:600}
  .list-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{width:28px;height:28px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;display:grid;place-items:center;color:#666;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;padding:10px 20px;background:#FAFAFA;border-bottom:1px solid var(--line);color:var(--muted);font-weight:500}
  td{padding:12px 20px;border-bottom:1px solid var(--line)}
  tr:hover td{background:#FAFAFA}
  .ops a{color:var(--primary);text-decoration:none;margin-right:12px;cursor:pointer}
  .ops a:hover{text-decoration:underline}
  .ops a.del{color:var(--primary)}
  .empty{text-align:center;padding:40px;color:#999}
</style>
</head>
<body>
<div class="layout">
  <aside class="g-side">
    <div class="logo">中免</div>
    <div class="g-nav">📁</div>
    <div class="g-nav">📋</div>
    <div class="g-nav on">📦</div>
    <div class="g-nav">🎯</div>
    <div class="g-nav">📺</div>
    <div class="g-nav">🔗</div>
    <div class="g-nav">📝</div>
    <div class="g-nav">👤</div>
  </aside>
  <aside class="sub-side">
    <div class="title">商品设置</div>
    <a class="sub-nav" href="category_management.html">后台类目</a>
    <a class="sub-nav on" href="attribute_template_list.html">属性模版管理</a>
    <a class="sub-nav" href="#">业务配置</a>
    <a class="sub-nav" href="#">Hscode基础数据</a>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>中免日上运营平台-demo</h1>
      <div class="right">
        <span>偏好设置</span>
        <div class="avatar">陆</div>
        <span>陆蓉洁</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on">属性模版管理</div>
    </div>
    <div class="content">
      <div class="filter">
        <div class="field">
          <label>属性模版名称</label>
          <input type="text" id="filterName" placeholder="请输入" />
        </div>
        <div class="field">
          <label>所属类目</label>
          <select id="filterCategory">
            <option value="">全部</option>
            <option value="运动/户外-户外装备-望远镜">运动/户外-户外装备-望远镜</option>
            <option value="无归属">无归属</option>
          </select>
        </div>
        <div class="filter-btns">
          <button class="btn btn-default" id="resetBtn">重置</button>
          <button class="btn btn-primary" id="searchBtn">查询</button>
        </div>
      </div>
      <div class="list-card">
        <div class="list-head">
          <h2>属性模版列表</h2>
          <div class="list-actions">
            <a href="attribute_template_new.html" class="btn btn-primary" style="text-decoration:none">+ 新建</a>
            <button class="icon-btn" title="刷新" id="refreshBtn">↻</button>
            <button class="icon-btn" title="列设置">☰</button>
            <button class="icon-btn" title="设置">⚙</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width:28%">属性模版名称</th>
              <th style="width:40%">所属类目</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const templates = [
  { id:1, name:'邮轮游测试模板', category:'运动/户外-户外装备-望远镜' },
  { id:2, name:'跟团游测试模板', category:'无归属' },
  { id:3, name:'自由行测试模板', category:'无归属' },
  { id:4, name:'门票测试模板', category:'无归属' },
  { id:5, name:'酒店测试模板', category:'无归属' },
  { id:6, name:'通用商品模板', category:'无归属' }
];

function renderTable(list) {
  const tbody = document.getElementById('tableBody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(t => `
    <tr>
      <td>${t.name}</td>
      <td>${t.category}</td>
      <td class="ops">
        <a href="attribute_template_new.html?name=${encodeURIComponent(t.name)}&category=${encodeURIComponent(t.category)}&mode=edit">编辑</a>
        <a href="attribute_template_new.html?name=${encodeURIComponent(t.name + '（副本）')}&category=${encodeURIComponent(t.category)}&mode=copy">复制</a>
        <a class="del" onclick="deleteTemplate(${t.id})">删除</a>
      </td>
    </tr>
  `).join('');
}

function doSearch() {
  const name = document.getElementById('filterName').value.trim();
  const cat = document.getElementById('filterCategory').value;
  let list = [...templates];
  if (name) list = list.filter(t => t.name.includes(name));
  if (cat) list = list.filter(t => t.category === cat);
  renderTable(list);
}

function deleteTemplate(id) {
  if (confirm('确定删除该属性模版？')) {
    const idx = templates.findIndex(t => t.id === id);
    if (idx > -1) templates.splice(idx, 1);
    doSearch();
  }
}

document.getElementById('searchBtn').onclick = doSearch;
document.getElementById('resetBtn').onclick = () => {
  document.getElementById('filterName').value = '';
  document.getElementById('filterCategory').value = '';
  renderTable(templates);
};
document.getElementById('refreshBtn').onclick = () => doSearch();

renderTable(templates);
</script>
</body>
</html>
