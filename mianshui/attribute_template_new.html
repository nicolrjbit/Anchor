<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新建属性模版 · 中免日上运营平台</title>
<style>
  :root{
    --primary:#7A2432;
    --primary-hover:#631D29;
    --sidebar:#1A1A2E;
    --sidebar-sub:#252538;
    --text:#333;
    --muted:#888;
    --line:#E8E8E8;
    --bg:#F0F2F5;
    --card:#FFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
  .layout{display:flex;min-height:100vh}
  .g-side{width:56px;background:var(--sidebar);flex:none;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
  .g-side .logo{width:32px;height:32px;border-radius:6px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-bottom:8px}
  .g-nav{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;color:#999;font-size:18px}
  .g-nav.on{background:var(--primary);color:#fff}
  .sub-side{width:160px;background:var(--sidebar-sub);flex:none;padding:12px 0;color:#aaa;font-size:12px}
  .sub-side .title{padding:8px 16px 12px;color:#666;font-size:11px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px}
  .sub-nav{display:block;padding:8px 16px;color:#bbb;text-decoration:none;border-left:3px solid transparent}
  .sub-nav.on{color:var(--primary);background:rgba(122,36,50,.15);border-left-color:var(--primary);font-weight:600}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:48px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;flex:none}
  .topbar h1{font-size:15px;font-weight:600}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .topbar .avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px}
  .tabs{height:40px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 16px;flex:none}
  .tab{padding:8px 16px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .content{flex:1;padding:16px;overflow:auto}
  .form-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 24px;margin-bottom:16px}
  .form-row{display:flex;margin-bottom:16px;align-items:flex-start}
  .form-row .label{width:140px;text-align:right;padding-right:16px;padding-top:6px;font-size:12px;color:#333;flex:none}
  .form-row .label.req::before{content:"*";color:var(--primary);margin-right:2px}
  .form-row .field{flex:1;max-width:480px}
  .form-row input[type=text],.form-row textarea,.form-row select{width:100%;border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px;font-family:inherit}
  .form-row input[disabled]{background:#F5F5F5;color:#999}
  .form-row textarea{min-height:64px;resize:vertical}
  .char-count{text-align:right;font-size:11px;color:#bbb;margin-top:2px}
  .btn-sm{border:none;border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;font-family:inherit;background:var(--primary);color:#fff}
  .btn-sm:hover{background:var(--primary-hover)}
  .attr-section{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .attr-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px}
  .attr-tab{padding:12px 16px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .attr-tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .attr-toolbar{padding:12px 16px;display:flex;gap:8px}
  .btn{border:none;border-radius:4px;padding:6px 16px;font-size:12px;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-default{background:#fff;border:1px solid var(--line);color:#333}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px;min-width:1200px}
  th{text-align:left;padding:8px 10px;background:#FAFAFA;border-bottom:1px solid var(--line);color:var(--muted);font-weight:500;white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid var(--line)}
  .empty-state{text-align:center;padding:48px;color:#bbb}
  .empty-state .icon{font-size:40px;margin-bottom:8px;opacity:.4}
  .footer-actions{display:flex;justify-content:center;gap:12px;padding:24px 0}
</style>
</head>
<body>
<div class="layout">
  <aside class="g-side">
    <div class="logo">中免</div>
    <div class="g-nav">📁</div>
    <div class="g-nav">📋</div>
    <div class="g-nav on">📦</div>
    <div class="g-nav">🎯</div>
    <div class="g-nav">📺</div>
    <div class="g-nav">🔗</div>
    <div class="g-nav">📝</div>
    <div class="g-nav">👤</div>
  </aside>
  <aside class="sub-side">
    <div class="title">商品设置</div>
    <a class="sub-nav" href="category_management.html">后台类目</a>
    <a class="sub-nav on" href="attribute_template_list.html">属性模版管理</a>
    <a class="sub-nav" href="#">业务配置</a>
    <a class="sub-nav" href="#">Hscode基础数据</a>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>中免日上运营平台-demo</h1>
      <div class="right">
        <span>偏好设置</span>
        <div class="avatar">陆</div>
        <span>陆蓉洁</span>
      </div>
    </div>
    <div class="tabs">
      <a class="tab" href="attribute_template_list.html">属性模版管理</a>
      <div class="tab on" id="pageTab">新建</div>
    </div>
    <div class="content">
      <div class="form-card">
        <div class="form-row">
          <div class="label">模版ID</div>
          <div class="field"><input type="text" id="templateId" disabled value="6214d1fce1f79500011cf28c" /></div>
        </div>
        <div class="form-row">
          <div class="label req">所属类目</div>
          <div class="field">
            <select id="category">
              <option value="">请选择类目</option>
              <option value="运动/户外-户外装备-望远镜">运动/户外-户外装备-望远镜</option>
              <option value="运动/户外-户外装备-登山包">运动/户外-户外装备-登山包</option>
              <option value="运动/户外-户外装备-帐篷">运动/户外-户外装备-帐篷</option>
              <option value="美妆护肤-面部护理-面霜">美妆护肤-面部护理-面霜</option>
              <option value="腕表/珠宝-腕表-机械表">腕表/珠宝-腕表-机械表</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="label req">模版编码</div>
          <div class="field">
            <input type="text" id="templateCode" maxlength="36" placeholder="请输入模版编码" />
            <div class="char-count"><span id="codeCount">0</span>/36</div>
          </div>
        </div>
        <div class="form-row">
          <div class="label">备注</div>
          <div class="field">
            <textarea id="remark" maxlength="200" placeholder="请输入"></textarea>
            <div class="char-count"><span id="remarkCount">0</span>/200</div>
          </div>
        </div>
        <div class="form-row">
          <div class="label">商详页标题拼接</div>
          <div class="field"><button class="btn-sm">设置</button></div>
        </div>
        <div class="form-row">
          <div class="label">商详页参数展示</div>
          <div class="field"><button class="btn-sm">设置</button></div>
        </div>
      </div>

      <div class="attr-section">
        <div class="attr-tabs">
          <div class="attr-tab on" data-tab="category">类目参数(<span id="catCount">0</span>)</div>
          <div class="attr-tab" data-tab="sales">销售属性(<span id="salesCount">0</span>)</div>
        </div>
        <div class="attr-toolbar">
          <button class="btn btn-primary" id="addAttr">新增属性</button>
          <button class="btn btn-primary" id="selectAttr">选择已有属性</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>属性名称</th>
                <th>前端显示名称</th>
                <th>输入形式</th>
                <th>属性值</th>
                <th>输入限制</th>
                <th>页面必填</th>
                <th>允许自定义属性值</th>
                <th>控件提示文案</th>
                <th>支持批量修改</th>
                <th>是否可导出</th>
                <th>排序</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="attrBody">
              <tr><td colspan="12"><div class="empty-state"><div class="icon">📭</div>暂无数据</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="footer-actions">
        <button class="btn btn-default" onclick="location.href='attribute_template_list.html'">取消</button>
        <button class="btn btn-primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'new';
const pageTab = document.getElementById('pageTab');
if (mode === 'edit') pageTab.textContent = '编辑';
else if (mode === 'copy') pageTab.textContent = '复制';

if (params.get('category')) {
  document.getElementById('category').value = params.get('category');
}

let activeTab = 'category';
let categoryAttrs = [];
let salesAttrs = [];

function getActiveList() { return activeTab === 'category' ? categoryAttrs : salesAttrs; }

function renderAttrs() {
  const list = getActiveList();
  document.getElementById('catCount').textContent = categoryAttrs.length;
  document.getElementById('salesCount').textContent = salesAttrs.length;
  const tbody = document.getElementById('attrBody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="12"><div class="empty-state"><div class="icon">📭</div>暂无数据</div></td></tr>';
    return;
  }
  tbody.innerHTML = list.map((a, i) => `
    <tr>
      <td>${a.name}</td><td>${a.display}</td><td>${a.inputType}</td><td>${a.values || '-'}</td>
      <td>${a.limit || '-'}</td><td>${a.required ? '是' : '否'}</td><td>${a.custom ? '是' : '否'}</td>
      <td>${a.tip || '-'}</td><td>${a.batch ? '是' : '否'}</td><td>${a.exportable ? '是' : '否'}</td>
      <td>${a.sort}</td>
      <td><a href="#" style="color:var(--primary)" onclick="removeAttr(${i});return false">删除</a></td>
    </tr>
  `).join('');
}

function removeAttr(i) {
  getActiveList().splice(i, 1);
  renderAttrs();
}

document.querySelectorAll('.attr-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.attr-tab').forEach(t => t.classList.remove('on'));
    tab.classList.add('on');
    activeTab = tab.dataset.tab;
    renderAttrs();
  };
});

document.getElementById('templateCode').oninput = function() {
  document.getElementById('codeCount').textContent = this.value.length;
};
document.getElementById('remark').oninput = function() {
  document.getElementById('remarkCount').textContent = this.value.length;
};

document.getElementById('addAttr').onclick = () => {
  const name = prompt('请输入属性名称');
  if (!name) return;
  getActiveList().push({
    name, display: name, inputType: '文本', values: '', limit: '200字',
    required: false, custom: false, tip: '', batch: false, exportable: true, sort: getActiveList().length + 1
  });
  renderAttrs();
};

document.getElementById('selectAttr').onclick = () => {
  alert('选择已有属性（Demo 占位）');
};

document.getElementById('saveBtn').onclick = () => {
  const cat = document.getElementById('category').value;
  const code = document.getElementById('templateCode').value.trim();
  if (!cat) { alert('请选择所属类目'); return; }
  if (!code) { alert('请输入模版编码'); return; }
  alert('保存成功（Demo）');
  location.href = 'attribute_template_list.html';
};

renderAttrs();
</script>
</body>
</html>
